<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Create Password — Pierre Azar</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0d0d0d;color:#f0f0f0;font-family:Arial,sans-serif;
      min-height:100vh;display:flex;flex-direction:column}
    header{padding:18px 5%;border-bottom:1px solid #1e1e1e}
    .logo{font-size:13px;font-weight:700;letter-spacing:.12em;color:#fff;text-decoration:none}
    .logo span{font-size:18px;letter-spacing:.15em}
    main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 5%}
    .card{background:#111;border:1px solid #1e1e1e;border-radius:8px;
      padding:36px 32px;width:100%;max-width:420px}
    h1{font-size:20px;letter-spacing:.06em;margin-bottom:8px}
    .sub{font-size:13px;color:#777;line-height:1.6;margin-bottom:24px}
    .field{margin-bottom:16px}
    label{display:block;font-size:12px;color:#888;letter-spacing:.06em;
      text-transform:uppercase;margin-bottom:6px}
    input{width:100%;background:#0d0d0d;border:1px solid #2a2a2a;border-radius:4px;
      padding:11px 14px;font-size:14px;color:#f0f0f0;outline:none}
    input:focus{border-color:#555}
    .btn{width:100%;background:#fff;color:#000;font-weight:700;font-size:14px;
      padding:12px;border:0;border-radius:4px;cursor:pointer;letter-spacing:.06em}
    .btn:disabled{opacity:.5;cursor:default}
    .msg{display:none;margin-top:14px;padding:10px 14px;border-radius:4px;
      font-size:13px;line-height:1.5}
    .msg.error{display:block;background:#1a1210;border:1px solid #4a2c1a;color:#c87941}
    .msg.success{display:block;background:#0d1a10;border:1px solid #1a4a2c;color:#5ab87e}
    .help{font-size:12px;color:#666;margin-top:20px;text-align:center}
    .help a{color:#aaa}
    footer{text-align:center;padding:20px;font-size:12px;color:#444;border-top:1px solid #1a1a1a}
    footer a{color:#555}
  </style>
</head>
<body>
<header><a href="/" class="logo">PA <span>PIERRE AZAR</span></a></header>
<main>
  <div class="card">
    <h1>CREATE YOUR PASSWORD</h1>
    <p class="sub">Set a password for your Premium Member account. You will be signed in automatically.</p>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" minlength="8" autocomplete="new-password"
        placeholder="Minimum 8 characters">
    </div>
    <div class="field">
      <label>Confirm Password</label>
      <input type="password" id="confirm-password" minlength="8" autocomplete="new-password"
        placeholder="Repeat your password">
    </div>
    <button class="btn" id="submit-btn" onclick="setPassword()">CREATE PASSWORD</button>
    <div class="msg" id="message"></div>
    <p class="help">Link expired? <a href="/member-login.html?setup=1">Request a new setup link</a></p>
  </div>
</main>
<footer><a href="/">← Back to pierreazar.com</a></footer>
<script>
(function(){
  var params = new URLSearchParams(location.hash.replace(/^#/, ''));
  var token = params.get('token');
  if (token) {
    sessionStorage.setItem('pa_password_setup_token', token);
    history.replaceState(null, '', location.pathname);
  }
  if (!token && !sessionStorage.getItem('pa_password_setup_token')) {
    showMessage('This setup link is missing or invalid. Request a new link.', 'error');
    document.getElementById('submit-btn').disabled = true;
  }
})();

function showMessage(text, type) {
  var el = document.getElementById('message');
  el.textContent = text;
  el.className = 'msg ' + type;
}

function setPassword() {
  var password = document.getElementById('password').value;
  var confirm = document.getElementById('confirm-password').value;
  var token = sessionStorage.getItem('pa_password_setup_token') || '';
  var btn = document.getElementById('submit-btn');
  if (password.length < 8) {
    showMessage('Password must be at least 8 characters.', 'error');
    return;
  }
  if (password !== confirm) {
    showMessage('Passwords do not match.', 'error');
    return;
  }
  btn.disabled = true;
  btn.textContent = 'SAVING…';
  fetch('/member/setup-password', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({token: token, password: password})
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    if (d.ok) {
      sessionStorage.removeItem('pa_password_setup_token');
      showMessage('Password created. Redirecting to your course…', 'success');
      setTimeout(function(){ location.href = d.redirect || '/course'; }, 700);
    } else {
      showMessage(d.error || 'Could not create password.', 'error');
      btn.disabled = false;
      btn.textContent = 'CREATE PASSWORD';
    }
  })
  .catch(function(){
    showMessage('Network error. Please try again.', 'error');
    btn.disabled = false;
    btn.textContent = 'CREATE PASSWORD';
  });
}

document.addEventListener('keydown', function(e){
  if (e.key === 'Enter') setPassword();
});
</script>
</body>
</html>
